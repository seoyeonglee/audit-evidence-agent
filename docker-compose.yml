services:
  api:
    image: python:3.12-slim
    working_dir: /workspace
    environment:
      DEMO_MODE: "1"
      DATABASE_URL: sqlite:////workspace/evidence-platform.db
    volumes:
      - .:/workspace
    command: sh -c "pip install -r requirements.txt && uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
