name: live-demo-screenshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Capture deployed UI without changing repository history
        working-directory: frontend
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1512, height: 1120 } });
          await page.goto('https://seoyoung-audit-evidence.onrender.com', { timeout: 180000 });
          await page.getByRole('heading', { name: 'Evidence operations' }).waitFor({ timeout: 180000 });
          await page.screenshot({ path: 'live-demo.png', fullPage: true });
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: live-demo-screenshot
          path: frontend/live-demo.png
